name: PR verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Shared and quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERIFY_EXPECTED_SHA: ${{ github.sha }}
      VERIFY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Clean checkout shared and quality gates
        run: node scripts/verification/verify.mjs core
      - name: Prove rejection gates and restoration
        run: node scripts/verification/verify.mjs failures
  browser:
    name: Safe browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERIFY_EXPECTED_SHA: ${{ github.sha }}
      VERIFY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Frozen install for browser OS prerequisite tool
        run: pnpm install --frozen-lockfile
      - name: Chromium system libraries
        run: pnpm exec playwright install-deps chromium
      - name: Fresh export and bounded local browser checks
        run: node scripts/verification/verify.mjs browser
