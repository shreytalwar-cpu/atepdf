plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'local.atepdf'
version = '0.1.0'

android {
  namespace 'expo.modules.atepdf'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  sourceSets {
    androidTest.java.srcDirs += file('../../../../../tests/native/android')
    androidTest.assets.srcDirs += file('../../../public/fixtures')
  }
}

dependencies {
  // Test-only libraries. The PDF adapter has no new runtime dependencies.
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
