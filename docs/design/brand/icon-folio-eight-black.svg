<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">atePDF app icon: Folio Eight on black (owner direction, SHR-106 polish review)</title>
  <!-- macOS icon grid: 824 pt body on a 1024 canvas, continuous-corner approximation rx 185.
       Black body, the approved Folio Eight in flat brand.irisLight, the fold in brand.fold.
       No gradient, no text, no illustration. A faint hairline keeps the edge on a dark Dock.
       Small sizes (16 and 32 px) drop the fold tint and keep only the cut (DESIGN_SYSTEM 2.4). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <g transform="translate(212 212) scale(6)">
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="27" y="8" width="46" height="44" rx="13" fill="#fff"/>
      <rect x="21" y="44" width="58" height="48" rx="16" fill="#fff"/>
      <rect x="40" y="21" width="20" height="17" rx="6.5" fill="#000"/>
      <rect x="37" y="57" width="26" height="22" rx="8" fill="#000"/>
      <polygon points="58,4 80,4 80,26" fill="#000"/>
    </mask>
    <rect width="100" height="100" fill="#A79EFF" mask="url(#m)"/>
    <path id="fold" d="M61.5 8.5 L72.5 19.5 L64.5 19.5 Q61.5 19.5 61.5 16.5 Z" fill="#E0DCFF"/>
  </g>
</svg>
