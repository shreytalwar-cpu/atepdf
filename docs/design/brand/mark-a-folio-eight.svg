<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="t">
  <title id="t">atePDF mark, direction A: Folio Eight</title>
  <!-- Two stacked sheets form an upright 8. The upper sheet is narrower (unequal bowls).
       The upper-right corner is folded: the only document cue. Single colour; the fold is a tint. -->
  <defs>
    <mask id="a-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="27" y="8" width="46" height="44" rx="13" fill="#fff"/>
      <rect x="21" y="44" width="58" height="48" rx="16" fill="#fff"/>
      <rect x="40" y="21" width="20" height="17" rx="6.5" fill="#000"/>
      <rect x="37" y="57" width="26" height="22" rx="8" fill="#000"/>
      <polygon points="58,4 80,4 80,26" fill="#000"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="currentColor" mask="url(#a-cut)" style="color:#5646F0"/>
  <path d="M61.5 8.5 L72.5 19.5 L64.5 19.5 Q61.5 19.5 61.5 16.5 Z" fill="#A9A2FF"/>
</svg>
