<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="t">
  <title id="t">atePDF mark, direction B: Speaking Page</title>
  <!-- A page with a folded corner whose lower-left corner becomes a speech tail.
       Two stacked counters inside form the 8. Document + conversation in one glyph. -->
  <defs>
    <mask id="b-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <path d="M32 6 H64 L82 24 V72 Q82 84 70 84 H34 L20 95 V20 Q20 6 32 6 Z" fill="#fff"/>
      <rect x="42" y="24" width="18" height="17" rx="7" fill="#000"/>
      <rect x="40" y="50" width="22" height="20" rx="8" fill="#000"/>
      <polygon points="62,4 84,4 84,26" fill="#000"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="#5646F0" mask="url(#b-cut)"/>
  <path d="M64.5 6.5 L81.5 23.5 H68.5 Q64.5 23.5 64.5 19.5 Z" fill="#A9A2FF"/>
</svg>
