<style>
/* Mockup page chrome (not part of the product). Everything inside .win uses only token variables. */
* { box-sizing: border-box; }
html, body { margin: 0; }

.page-head { position: sticky; top: 0; z-index: 100; display: flex; gap: 16px; align-items: center; padding: 10px 24px; background: var(--surface-elevated); border-bottom: 1px solid var(--border-hairline); flex-wrap: wrap; }

.page-head nav a { font: var(--type-meta); color: var(--text-secondary); text-decoration: none; padding: 3px 7px; border-radius: var(--radius-sm); }
.page-head nav a:hover { background: var(--surface-hover); color: var(--text-primary); }
.theme-switch { display: flex; background: var(--bg-sunken); border-radius: var(--radius-sm); padding: 2px; }
.theme-switch button { font: var(--type-uiStrong); border: 0; background: transparent; color: var(--text-secondary); height: 24px; padding: 0 10px; border-radius: 4px; cursor: pointer; }

.frames { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }

/* ——— Window ——— */
.win { position: relative; display: flex; flex-direction: column; width: var(--w, 1024px); height: var(--h, 680px); background: var(--bg-window); color: var(--text-primary); border-radius: 10px; overflow: hidden; box-shadow: var(--elev-3); outline: 1px solid var(--border-hairline); font: var(--type-ui); flex: none; }

.lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.tb { height: var(--size-toolbar-height); flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 84px; border-bottom: 1px solid var(--border-hairline); position: relative; z-index: 10; }
.tb .spacer { flex: 1; }
.ctx { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: var(--radius-sm); color: var(--text-primary); font: var(--type-uiStrong); white-space: nowrap; }
.ctx .m { font: var(--type-meta); color: var(--text-secondary); font-variant-numeric: tabular-nums; }

.ib.sm { width: 24px; height: 24px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 8px; border-radius: var(--radius-full); font: var(--type-meta); white-space: nowrap; }

.pill.out { background: var(--status-outbound-bg); color: var(--status-outbound-fg); }
.pill.muted { background: var(--bg-sunken); color: var(--text-secondary); }
.pill.icononly { width: 24px; padding: 0; justify-content: center; }
.body { flex: 1; display: flex; min-height: 0; position: relative; }
.col { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

.req .g { color: var(--text-tertiary); position: relative; top: 2px; }
.req .ctxline { display: block; font: var(--type-meta); color: var(--text-secondary); margin-bottom: 2px; }
.msg { font: var(--type-body); color: var(--text-primary); margin: 0; }
.msg.with-icon { display: flex; gap: 8px; align-items: flex-start; }
.msg.with-icon > svg { flex: none; margin-top: 2.5px; }
.m, .meta { font: var(--type-meta); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.t3 { color: var(--text-tertiary); }
.card { background: var(--surface-raised); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); box-shadow: var(--elev-1); padding: 12px 14px; }

.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.tag { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: var(--radius-xs); font: var(--type-caption); letter-spacing: var(--type-caption-tracking); white-space: nowrap; flex: none; }

.tag.lock { color: var(--text-secondary); background: var(--bg-sunken); }
.tag.pro { background: var(--accent-subtle); color: var(--accent-text); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--size-control-md); padding: 0 10px; border-radius: var(--radius-sm); font: var(--type-uiStrong); border: 1px solid transparent; white-space: nowrap; flex: none; }
.btn.lg { height: var(--size-control-lg); padding: 0 12px; }
.btn.primary { background: var(--accent-fill); color: var(--text-onAccent); }
.btn.primary.hover { background: var(--accent-fillHover); }
.btn.primary.pressed { background: var(--accent-fillPressed); }
.btn.secondary { background: var(--surface-raised); border-color: var(--border-hairline); box-shadow: var(--elev-1); color: var(--text-primary); }

.btn.disabled { color: var(--text-disabled); background: var(--surface-hover); box-shadow: none; border-color: transparent; }
.btn.focus { outline: 2px solid var(--focus-ring-color); outline-offset: 2px; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; border: 1px solid var(--border-hairline); border-radius: var(--radius-xs); font: var(--type-kbd); color: var(--text-tertiary); background: transparent; font-variant-numeric: tabular-nums; }
.btn.primary .kbd { color: var(--text-onAccent); border-color: rgba(255,255,255,.35); }
.thumb { flex: none; background: var(--page-paper); border-radius: var(--radius-thumb); box-shadow: var(--elev-page); position: relative; overflow: hidden; }
.thumb i { position: absolute; left: 14%; right: 14%; height: 1.5px; background: #D9DBE3; border-radius: 1px; }
.thumb i.h { background: #7B8196; height: 2.5px; right: 38%; }
.thumb i.bar { left: 0; right: 0; top: 0; height: 16%; background: #243052; border-radius: 0; }
.thumb.scan { background: #F4F1EA; } .thumb.scan i { background: #B9B3A5; }
.thumb.blank i { display: none; }
.thumb.photo { background: linear-gradient(160deg, #B9D4E8, #6E8FAE 55%, #45566B); }
.thumb.photo i { display: none; }
.thumb.locked { background: var(--bg-sunken); box-shadow: none; outline: 1px solid var(--border-hairline); display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); }
.thumb.locked i { display: none; }
.actglyph { display: inline-flex; flex-direction: column; gap: 2px; width: 14px; height: 14px; justify-content: center; align-items: center; flex: none; }
.actglyph b { width: 10px; height: 5px; border-radius: 1.5px; background: var(--accent-text); animation: act var(--motion-duration-activityCycle) var(--motion-easing-standard) infinite; }
.actglyph b:nth-child(2) { animation-delay: calc(var(--motion-duration-activityCycle) / -2); }
@keyframes act { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .actglyph b { animation: none; } }
.activity { display: flex; gap: 10px; align-items: flex-start; padding: 2px 0; }
.activity .glyphbox { width: 24px; height: 24px; border-radius: var(--radius-sm); background: var(--accent-subtle); display: flex; align-items: center; justify-content: center; flex: none; }
.activity .lbl { font: var(--type-uiStrong); }
.activity .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.marker { display: inline-flex; align-items: center; gap: 4px; font: var(--type-meta); }
.marker.local { color: var(--status-local-fg); }
.marker.ai { color: var(--text-secondary); }
.marker.out { color: var(--status-outbound-fg); }
.steps { margin: 6px 0 0 2px; padding-left: 12px; border-left: 1px solid var(--border-hairline); display: flex; flex-direction: column; gap: 6px; }
.steps div { display: flex; align-items: center; gap: 8px; font: var(--type-ui); }
.steps .st { margin-left: auto; font: var(--type-meta); color: var(--text-secondary); }
.composer-wrap { padding: 0 var(--size-conversation-gutter) 16px; display: flex; flex-direction: column; align-items: center; flex: none; }
.composer { width: 100%; max-width: var(--size-conversation-maxWidth); background: var(--surface-raised); border: 1px solid var(--border-hairline); border-radius: var(--radius-xl); box-shadow: var(--elev-2); }
.composer.focus { border-color: var(--accent-subtleBorder); box-shadow: var(--elev-2), 0 0 0 2px color-mix(in srgb, var(--accent-fill) 14%, transparent); }
.composer .ctxrow { display: flex; align-items: center; gap: 6px; padding: 10px 12px 0; font: var(--type-meta); color: var(--text-secondary); }
.composer .input { padding: 8px 12px 4px; font: var(--type-body); color: var(--text-tertiary); min-height: 29px; }
.composer .input.typed { color: var(--text-primary); }
.caret { display: inline-block; width: 1.5px; height: 17px; background: var(--accent-fill); vertical-align: -3px; margin-left: 1px; }
.composer .actions { display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px; }
.composer .actions .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--radius-sm); background: var(--bg-sunken); font: var(--type-meta); color: var(--text-primary); white-space: nowrap; }
.chip.more { color: var(--text-secondary); gap: 4px; }
.send { width: 28px; height: 28px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; background: var(--surface-hover); color: var(--text-disabled); flex: none; }
.send.on { background: var(--accent-fill); color: var(--text-onAccent); }
.send.stop { background: var(--surface-raised); border: 1px solid var(--border-hairline); color: var(--text-primary); box-shadow: var(--elev-1); }
.send.stop b { width: 8px; height: 8px; background: currentColor; border-radius: 1.5px; }
.hint { font: var(--type-meta); color: var(--text-tertiary); padding-top: 8px; display: flex; gap: 10px; align-items: center; justify-content: center; }
.allow { font: var(--type-meta); color: var(--text-tertiary); font-variant-numeric: tabular-nums; margin-right: 4px; }
.panel { width: var(--size-panel-files-default); flex: none; background: var(--bg-panel); border-left: 1px solid var(--border-hairline); display: flex; flex-direction: column; padding: 12px 8px; gap: 4px; }
.panel .sec { font: var(--type-section); color: var(--text-tertiary); padding: 10px 8px 4px; display: flex; justify-content: space-between; }
.panel .foot { margin-top: auto; padding: 10px 8px 2px; border-top: 1px solid var(--border-hairline); display: flex; align-items: center; gap: 6px; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
.empty h3 { font: var(--type-title1); letter-spacing: var(--type-title1-tracking); margin: 16px 0 6px; }
.examples { margin-top: 24px; width: 100%; max-width: 380px; text-align: left; }
.examples .row { color: var(--text-secondary); }
.banner { display: flex; align-items: center; gap: 10px; background: var(--surface-raised); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); padding: 8px 8px 8px 12px; }
.banner .grow { flex: 1; }
.overlay { position: absolute; inset: 0; z-index: 30; background: var(--dropzone-fill); display: flex; align-items: center; justify-content: center; }
.overlay .zone { position: absolute; inset: 12px; border: 1.5px dashed var(--accent-fill); border-radius: var(--radius-xl); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.overlay h4 { font: var(--type-title2); margin: 8px 0 0; }
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: center; justify-content: center; }
.sheet { background: var(--surface-elevated); border-radius: var(--radius-2xl); box-shadow: var(--elev-3); outline: 1px solid var(--border-hairline); display: flex; flex-direction: column; overflow: hidden; }
.sheet .sh-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }

.sheet h3 { font: var(--type-title1); letter-spacing: var(--type-title1-tracking); margin: 0; }
.dl { display: grid; grid-template-columns: 120px 1fr; gap: 10px 14px; align-items: start; }
.dl dt { font: var(--type-section); color: var(--text-tertiary); padding-top: 1px; }
.dl dd { margin: 0; font: var(--type-ui); }
.palette { position: absolute; z-index: 40; width: var(--size-palette-width); background: var(--surface-elevated); border-radius: var(--radius-xl); box-shadow: var(--elev-3); outline: 1px solid var(--border-hairline); overflow: hidden; }
.palette .search { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border-hairline); font: var(--type-body); color: var(--text-primary); }
.palette .list { padding: 6px; }
.palette .sec { font: var(--type-section); color: var(--text-tertiary); padding: 8px 8px 4px; }

.seg { display: inline-flex; background: var(--bg-sunken); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg span { height: 24px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 4px; font: var(--type-ui); color: var(--text-secondary); }
.seg span.on { background: var(--surface-raised); color: var(--text-primary); box-shadow: var(--elev-1); font: var(--type-uiStrong); }

.toggle.on { background: var(--accent-fill); } .toggle.on::after { left: 16px; }
.field { height: 28px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface-raised); display: flex; align-items: center; gap: 8px; padding: 0 8px; font: var(--type-ui); color: var(--text-tertiary); }
.field.focus { border-color: var(--accent-fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-fill) 20%, transparent); color: var(--text-primary); }

.set-tabs { display: flex; justify-content: center; gap: 2px; padding: 10px; border-bottom: 1px solid var(--border-hairline); }

<body>
<div class="page-head">
  <h1>atePDF v1 · SHR-105 mockups</h1>
  <nav id="nav"></nav>
  <div class="theme-switch" role="group" aria-label="Appearance">
    <button data-set="light" aria-pressed="true">Light</button>
    <button data-set="dark" aria-pressed="false">Dark</button>
  </div>
</div>
<main class="doc" id="doc"></main>

<script>
/* ——— Icons (Lucide-style, 24 grid, 1.75 stroke) ——— */
const P = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  down:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',

const ic = (n, s = 16, extra = '') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${P[n]}</svg>`;

/* ——— Building blocks ——— */
const thumb = (w, h, kind = 'text') => {
  if (kind === 'locked') return `<div class="thumb locked" style="width:${w}px;height:${h}px">${ic('lock', Math.round(w * .38))}</div>`;
  let lines = '';
  if (kind === 'invoice') lines = `<i class="bar"></i><i class="h" style="top:26%"></i>` + [38, 46, 54, 62, 70, 78].map(t => `<i style="top:${t}%"></i>`).join('');
  else if (kind === 'text' || kind === 'scan') lines = `<i class="h" style="top:14%"></i>` + [26, 34, 42, 50, 58, 66, 74, 82].map(t => `<i style="top:${t}%;right:${t % 3 ? 14 : 30}%"></i>`).join('');
  return `<div class="thumb ${kind}" style="width:${w}px;height:${h}px">${lines}</div>`;
};
const glyph = () => `<span class="actglyph" aria-hidden="true"><b></b><b></b></span>`;
const kbd = k => `<span class="kbd">${k}</span>`;
const lights = () => `<div class="lights"><i></i><i></i><i></i></div>`;
function toolbar({ ctx = null, busy = null, panelOn = false, compact = false } = {}) {
  const c = busy ? `<span class="ctx">${glyph()} ${busy}</span>`
    : ctx ? `<span class="ctx">${ctx.icon ? ic(ctx.icon, 14) : ''}${ctx.t} <span class="m">${ctx.m || ''}</span>${ic('chevD', 14, 'style="color:var(--text-tertiary)"')}</span>`
    : `<span class="ctx disabled">No files yet</span>`;
  return `${lights()}<div class="tb">${c}<span class="spacer"></span>
    ${compact ? `<span class="pill local icononly" title="On this Mac">${ic('shield', 14)}</span>` : `<span class="pill local">${ic('shield', 14)}On this Mac</span>`}
    <span class="ib ${panelOn ? 'on' : ''}" title="Files panel ⌥⌘I">${ic('panel')}</span><span class="ib" title="More">${ic('more')}</span></div>`;
}
const req = (t, ctxline = '') => `<div class="req"><span class="g">${ic('chevR', 14)}</span><span>${ctxline ? `<span class="ctxline">${ctxline}</span>` : ''}${t}</span></div>`;
const msg = t => `<p class="msg">${t}</p>`;
const notice = (icon, color, t, actions = '') => `<div class="vstack" style="gap:6px"><p class="msg with-icon">${icc(icon, color)}<span>${t}</span></p>${actions ? `<div class="hstack" style="padding-left:24px">${actions}</div>` : ''}</div>`;
function fileRow({ n, name, facts, kind = 'text', tags = '', cls = '', hover = '', tall = true, ord = true }) {
  return `<div class="row ${tall ? 'tall' : ''} ${cls}">${ord && n ? `<span class="ord">${n}</span>` : ''}${thumb(28, 36, kind)}<div class="grow"><span class="name">${name}</span><span class="m">${facts}</span></div>${tags}${hover}</div>`;
}

function sourceGroup({ state = 'done', extra = [] } = {}) {

function activity({ label, detail, marker = 'local', steps = null, stop = true }) {

function composer({ ph = 'Describe what you need…', typed = '', ctx = '', chips = [], send = 'off', focus = false, allowance = '', hint = false, warn = '' } = {}) {

    thread: `<div class="task" style="opacity:.5">${sourceGroup()}</div>`,
    comp: composer({ ph: 'What should I do with these 3 PDFs?', chips: ['Merge in this order', 'Compress', 'Make searchable'] }),
    overlay: `<div class="palette" style="left:232px;bottom:96px"><div class="search">${icc('search', '--text-tertiary')}<span>com</span><span class="caret" style="margin-left:-6px"></span><span class="m" style="margin-left:auto">3 sources</span></div>
      <div class="list"><div class="sec">Suggested</div>
      <div class="row sel">${icc('down', '--text-secondary')}<span class="name"><b>Com</b>press</span><span class="r"><span class="m">3 PDFs · 8.6 MB</span>${ic('enter', 14)}</span></div>
      <div class="row">${icc('files', '--text-secondary')}<span class="name">Merge and <b>com</b>press</span><span class="r"><span class="m">3 PDFs</span></span></div>
      <div class="sec">All actions</div>
      <div class="row">${icc('scan', '--text-secondary')}<span class="name">Make searchable…</span><span class="r"><span class="m">Signed-Appendix-scan.pdf</span></span></div>
      <div class="row" style="color:var(--text-disabled)">${icc('lock', '--text-disabled')}<span class="name" style="color:var(--text-disabled)">Unlock…</span><span class="r"><span class="m" style="color:var(--text-tertiary)">No locked files</span></span></div>
      <div class="sec">Workspace</div>
      <div class="row">${icc('plus', '--text-secondary')}<span class="name">Add Files…</span><span class="r">${kbd('⌘O')}</span></div>
      <div class="row">${icc('shield', '--text-secondary')}<span class="name">Privacy &amp; Storage…</span></div></div>
      <div class="foot"><span>${kbd('↑↓')} move</span><span>${kbd('↩')} ask atePDF</span><span>${kbd('esc')} close</span></div></div>` })),
  'Choosing "Compress" appends the RequestBlock "Compress these 3 PDFs" and sends it through the same path as typed text (D-04, CONV-01).']);

S.push(['conversation', 'Active conversation · planning (S6.1)', 'Requests are left-aligned blocks, not chat bubbles. Assistant text sits on the window. Planning names where the instruction goes. Expanded window with the Files panel docked.',
  win(shell({ tb: { busy: 'Planning…', panelOn: true },
    thread: `<div class="task">${sourceGroup()}${msg('Your 3 PDFs are ready. What would you like to do? Merge uses this order.')}</div>
      <div class="task">${req('Merge these three PDFs')}${activity({ label: 'Planning', detail: 'Sending your instruction to atePDF AI. Your files stay here.', marker: 'ai' })}</div>`,
    comp: composer({ ph: 'You can type the next request while this runs', send: 'stop' }),
    side: panel({}) }), { w: 1280, h: 720 }),
  'Hovering the "atePDF AI" marker explains exactly what is sent: the instruction plus anonymous facts (page counts, sizes). Files and names are not sent (PRIV-02).']);

S.push(['clarify', 'Clarification (S6.2)', 'One specific question with the relevant choices, numbered for the keyboard. The answer is bound to this workspace revision, and the choice goes stale if the files change.',
  win(shell({ tb: { ctx: { icon: 'files', t: '3 PDFs', m: '24 pages' } },
    thread: `<div class="task">${req('Remove page 3')}${msg('Which PDF should I remove page 3 from?')}
      <div class="group" role="radiogroup">
        ${SOURCES.map((s, i) => `<div class="row tall ${i === 1 ? 'sel focus' : ''}">${kbd(i + 1)}${thumb(28, 36, s.kind)}<div class="grow"><span class="name">${s.name}</span><span class="m">${s.facts}</span></div>${i === 1 ? `<span style="color:var(--text-tertiary)">${ic('enter', 14)}</span>` : ''}</div>`).join('')}
        <div class="row">${kbd('4')}<span class="name" style="color:var(--text-secondary)">Something else…</span></div></div></div>`,
    comp: composer({ ph: 'Answer, or ask for something else…', ctx: `<span>Answering</span><span style="color:var(--text-primary)">Which PDF should I remove page 3 from?</span>`, send: 'off' }) })) +
  win(shell({ tb: { ctx: { icon: 'files', t: '3 PDFs', m: '24 pages' } },
    thread: `<div class="task" style="opacity:.6">${req('Remove page 3')}${msg('Which PDF should I remove page 3 from?')}<div class="group" style="opacity:.6">${SOURCES.slice(0, 2).map((s, i) => `<div class="row">${kbd(i + 1)}<span class="name">${s.name}</span></div>`).join('')}</div><span class="m">This question is closed.</span></div>
      <div class="task">${req('Actually, merge them first')}${activity({ label: 'Planning', detail: 'Sending your instruction to atePDF AI. Your files stay here.', marker: 'ai' })}</div>`,
    comp: composer({ send: 'stop', ph: '' }) }), { w: 560, h: 680 }),
  'Second frame: a new request supersedes the pending question, so the old choices go stale instead of executing later (CONV-04).']);

S.push(['processing', 'Processing, cancel and verification (S8)', 'Real stages only: the operation, then an independent check. Steps appear in a disclosure. Stop is always one key away. No percentages unless the engine reports real units.',
  win(shell({ tb: { busy: 'Removing pages…', panelOn: true },
    thread: `<div class="task" style="opacity:.55">${earlierRow('Merged PDF', '24 pages · 8.6 MB')}</div>
      <div class="task">${req('Remove pages 2 and 7')}${activity({ label: 'Verifying the result', detail: 'Checking pages, order and text with an independent reader', marker: 'local', steps: { label: '2 of 2', rows: [['done', 'Remove pages 2 and 7 from Merged PDF', 'Done'], ['active', 'Verify the new copy', 'Checking']] } })}</div>`,
    comp: composer({ send: 'stop', ph: 'Finish or stop the current task before sending' }),
    side: panel({ results: [{ name: 'Merged PDF', facts: '24 pages · 8.6 MB', tags: '<span class="tag cur">Current</span>' }] }) }), { w: 1280, h: 640 }) +
  win(shell({ tb: { ctx: { icon: 'file', t: 'Merged PDF', m: '24 pages' } },
    thread: `<div class="task">${req('Make it searchable')}${activity({ label: 'Making text searchable', detail: 'Page 4 of 24', marker: 'local', stop: false })}<span class="m" style="padding-left:34px">Stopping…</span></div>
      <div class="task">${notice('stopFill', '--text-secondary', 'Stopped. No new result was created. Merged PDF is still current.')}</div>`,
    comp: composer({ ph: 'What next for Merged PDF?' }) }), { w: 560, h: 640 }),
  'Second frame: the Stop sequence. "Page 4 of 24" appears only because the OCR engine reports pages. After Stop, controller truth decides the wording.']);

S.push(['confirm', 'Quality confirmation + secure password (S8.4, S10.6)', 'From the reference journey: "Try to get it below 5 MB, then password-protect it."',
  win(shell({ tb: { busy: 'Waiting for password', panelOn: false },
    thread: `<div class="task">${req('Try to get it below 5 MB, then password-protect it')}
      <div class="card"><div class="hstack" style="gap:10px;align-items:flex-start;flex-wrap:nowrap">${icc('warn', '--status-warning-fg')}<div class="vstack" style="gap:4px;flex:1"><span style="font:var(--type-headline)">Image quality may change</span><span class="msg" style="font:var(--type-ui);color:var(--text-secondary)">To get below 5 MB I'd re-encode images. Text and vector graphics stay sharp. I'll make a copy; your current result stays as it is.</span><span class="m" style="margin-top:6px;display:flex;gap:6px;align-items:center">${icc('check', '--status-success-fg', 12)}You chose: Create Copy</span></div></div></div></div>
      <div class="task">${req('Yes, create a copy')}${msg('Enter the password in the secure field below. It stays on your Mac.')}
      <div class="card" style="border-color:color-mix(in srgb, var(--status-local-fg) 40%, transparent)"><div class="vstack" style="gap:10px">
        <div class="hstack" style="gap:8px">${icc('key', '--text-secondary')}<span style="font:var(--type-headline)">Choose a password for the protected copy</span></div>
        <div class="hstack" style="gap:8px;flex-wrap:nowrap"><div class="field focus" style="flex:1"><span class="dots">••••••••••</span><span class="caret"></span></div><div class="field" style="flex:1">Confirm password</div></div>
        <div class="hstack" style="justify-content:space-between"><span class="marker local">${ic('shield', 12)}Stays on this Mac. It's never added to the chat or sent to AI.</span><div class="hstack" style="gap:6px"><span class="btn plain">Cancel</span><span class="btn primary">Protect</span></div></div>
      </div></div></div>`,
    comp: composer({ ph: 'Use the password field above; don\'t type passwords here' }) })),
  'The plan pauses at Protect. If a password is typed into the composer instead, the existing secret detection withholds it and shows an inline warning (PDF-06).']);

S.push(['result', 'Result (S9.1–S9.3, S9.7, S9.9)', 'One card per outcome, with measured facts, honest caveats, and a receipt that only says "Saved" after the write succeeds. Undo sits with the current result.',
  win(shell({ tb: { ctx: { icon: 'lock', t: 'Protected PDF', m: '22 pages' }, panelOn: false },
    thread: `<div class="task" style="opacity:.55">${earlierRow('PDF without pages 2 and 7', '22 pages · 8.2 MB')}</div>
      <div class="task">${req('Try to get it below 5 MB, then password-protect it')}${msg('Done. It\'s 4.6 MB, down from 8.2 MB, and it now needs the password to open. I reduced image quality slightly.')}
      ${resultCard({ title: 'Protected PDF', facts: '22 pages · 8.2 MB → 4.6 MB', tags: '<span class="tag warn">Quality changed</span><span class="tag lock">' + ic('lock', 11) + 'Password to open</span>', note: 'atePDF didn\'t keep the password. Your originals and earlier results are unchanged.', receipt: `${icc('check', '--status-success-fg', 14)}Saved to Documents as Protected PDF.pdf`, kind: 'text' })}</div>`,
    comp: composer({ ph: 'What next for Protected PDF?', ctx: `<span>Working on</span>${chipCtx('text', 'Protected PDF · 22 pp')}`, chips: ['Extract text', 'Split…'], allowance: '9 free left' }) })) +
  win(shell({ tb: { ctx: { icon: 'file', t: 'Merged PDF', m: '24 pages' } },
    thread: `<div class="task">${req('Undo that')}${msg('I restored the previous result. Your originals are unchanged.')}${resultCard({ title: 'Merged PDF', facts: '24 pages · 8.6 MB', tags: '<span class="m">Restored</span>', receipt: 'Save cancelled · still ready to save', undo: false, actionsBelow: true })}
      ${earlierRow('PDF without pages 2 and 7', '22 pages · 8.2 MB', 'text', '<span class="tag earl">Undone</span>')}</div>`,
    comp: composer({ ph: 'What next for Merged PDF?' }) }), { w: 520, h: 680 }),
  'Second frame: after Undo (narrow window, where the actions wrap below the facts). The undone result stays savable as an Earlier row. There is no redo.']);

S.push(['history', 'Multiple results, collections and history (S9.4, S9.8, S5)', 'Earlier results collapse in place. The Files panel is the document index: results newest-first, sources in order (drag or ⌥↑/⌥↓ to reorder), and local storage used.',
  win(shell({ tb: { ctx: { icon: 'files', t: 'Split into 3 PDFs', m: '3 files' }, panelOn: true },
    thread: `<div class="task">${req('Merge these three PDFs')}${earlierRow('Merged PDF', '24 pages · 8.6 MB')}</div>
      <div class="task">${req('Remove pages 2 and 7')}${earlierRow('PDF without pages 2 and 7', '22 pages · 8.2 MB')}</div>
      <div class="task">${req('Split it into invoice, report and appendix')}${msg('I split it into 3 PDFs, using the original file boundaries.')}
      <div class="card" data-testid="current-result"><div class="hstack" style="gap:10px;flex-wrap:nowrap"><span style="color:var(--text-secondary)">${ic('files', 20)}</span><div class="vstack" style="gap:3px;flex:1"><span style="font:var(--type-headline)">Split into 3 PDFs</span><span class="m">3 files · 22 pages · 8.2 MB total</span></div><span class="tag cur">Current</span><span class="tag ok">${ic('check', 12)}Verified</span><span class="btn primary">${ic('folderDown')}Save All… ${kbd('⌥⌘S')}</span></div>
        <div class="group" style="margin-top:10px;box-shadow:none">${[['1', 'Merged – 1 Invoice.pdf', '2 pages · 190 kB', 'invoice'], ['2', 'Merged – 2 Board report.pdf', '12 pages · 2.7 MB', 'text'], ['3', 'Merged – 3 Appendix.pdf', '8 pages · 5.3 MB', 'scan']].map(([n, name, f, k], i) => fileRow({ n, name, facts: f, kind: k, cls: i === 1 ? 'hover' : '', hover: i === 1 ? `<span class="ib sm">${ic('eye', 14)}</span><span class="ib sm">${ic('save', 14)}</span>` : '' })).join('')}</div>
        <div class="m" style="margin-top:8px">Saved 3 files to Downloads/Merged – split</div></div></div>`,
    comp: composer({ ph: 'What next for these 3 PDFs?' }),
    side: panel({ results: [{ name: 'Split into 3 PDFs', facts: '3 files · 8.2 MB', tags: '<span class="tag cur">Current</span>' }, { name: 'PDF without pages 2 and 7', facts: '22 pages · 8.2 MB' }, { name: 'Merged PDF', facts: '24 pages · 8.6 MB' }], sel: 0 }) }), { w: 1280, h: 720 })]);

S.push(['quicklook', 'Quick Look preview (S9.6)', 'Space on any file, row or thumbnail. Read-only, with page rail, page navigation and zoom. Esc returns focus to where you were. This replaces the inline preview inside the card.',
  win(shell({ tb: { ctx: { icon: 'file', t: 'Merged PDF', m: '24 pages' } }, thread: `<div class="task">${resultCard({ title: 'Merged PDF', facts: '24 pages · 8.6 MB' })}</div>`, comp: composer({}),
    overlay: `<div class="scrim"><div class="sheet" role="dialog" aria-label="Read-only preview" style="width:880px;height:600px">

      <div style="flex:1;display:flex;min-height:0"><div class="ql-rail">${[1, 2, 3, 4].map(p => `<div class="pg ${p === 2 ? 'on' : ''}">${thumb(52, 68, p === 1 ? 'invoice' : p === 4 ? 'scan' : 'text')}<span class="m">${p}</span></div>`).join('')}</div>
      <div class="ql-well">${thumb(300, 388, 'text')}</div></div>
      <div class="ql-bar"><span class="ib">${ic('chevL')}</span><span class="m">Page 2 of 24</span><span class="ib">${ic('chevR')}</span><span style="flex:1"></span><span class="ib">−</span><span class="m">Fit</span><span class="ib">+</span></div></div></div>` }))]);

S.push(['consent', 'Content-transfer consent (S10.3) <span class="illustrative">Illustrative: no v1 flow triggers this</span>', 'For any future operation that needs content to leave the Mac. The sheet shows the exact pages, the recipients, purpose, retention and the consequence of declining. The default is not to send. There is no "always allow".',
  win(shell({ tb: { ctx: { icon: 'file', t: 'Signed-Appendix-scan.pdf', m: '8 pages' } }, thread: `<div class="task">${req('Recognise the handwriting on the signature pages')}${msg('Handwriting recognition needs a service outside your Mac. Here\'s exactly what would be sent.')}</div>`, comp: composer({}),
    overlay: `<div class="scrim"><div class="sheet" role="dialog" style="width:var(--size-sheet-md)"><div class="sh-body">
      <span class="pill out" style="align-self:flex-start">${ic('out', 14)}Leaves this Mac</span>
      <h3>Send 3 pages of Signed-Appendix-scan.pdf to {Provider}?</h3>
      <dl class="dl"><dt>What</dt><dd><div class="hstack" style="gap:8px">${[6, 7, 8].map(p => `<span class="vstack" style="gap:3px;align-items:center">${thumb(40, 52, 'scan')}<span class="m">p. ${p}</span></span>`).join('')}<span class="m" style="margin-left:6px">Page images only · no file name</span></div></dd>
      <dt>To</dt><dd>atePDF relay → {Provider}</dd>
      <dt>Why</dt><dd>Recognise handwritten text on these pages</dd>
      <dt>Kept by them</dt><dd class="m">{Verified provider retention statement}</dd>
      <dt>Kept by atePDF</dt><dd class="m">{Verified atePDF relay storage statement}</dd>
      <dt>If you don't send</dt><dd class="m">Printed text is still recognised on this Mac; the handwriting won't be.</dd></dl>

      <div class="sh-foot"><span class="btn secondary focus">Don't Send</span><span class="btn primary">Send 3 Pages</span></div></div></div>` })),
  'Initial focus is on Don\'t Send. The send button always states the scope. Cancel means nothing is sent (PRIV-06). Values in {braces} come from verified provider configuration.']);

const settingsTabs = on => `<div class="set-tabs">${[['gear', 'General'], ['shield', 'Privacy & Storage'], ['cloud', 'AI'], ['user', 'Account & Pro'], ['info', 'About']].map(([i, t]) => `<span class="${t === on ? 'on' : ''}">${ic(i, 18)}${t}</span>`).join('')}</div>`;
S.push(['privacy', 'Settings · Privacy & Storage (S12.2)', 'Plain statements, real storage numbers, retention (values from OPEN-05 / SHR-40), a transfer log and deletion.',
  win(shell({ tb: {}, empty: '<div class="empty"></div>', comp: composer({}),

S.push(['onboarding', 'Onboarding (S13)', 'Three short panes, no signup, no skip (pane 2 carries the hosted-AI disclosure). Illustrations are built from real components.',
  win(shell({ tb: {}, empty: '<div class="empty"></div>', comp: '',

      <p class="msg" style="color:var(--text-secondary)">PDFs are processed on your Mac. Your instructions go to atePDF AI to plan the steps. Files and names don't. If anything else ever needs to leave, you'll be asked first.</p></div>
      <div class="sh-foot" style="justify-content:space-between"><span class="hstack" style="gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:var(--text-tertiary)"></span><span style="width:6px;height:6px;border-radius:50%;background:var(--accent-fill)"></span><span style="width:6px;height:6px;border-radius:50%;background:var(--text-tertiary)"></span></span><span class="hstack" style="gap:8px"><span class="btn plain">Back</span><span class="btn primary lg">Continue</span></span></div></div></div>` }), { w: 820, h: 600 }) +
  `<div class="vstack" style="gap:16px">${[['1', 'Just say what you need.', 'Add PDFs or images, then describe the result. atePDF makes a new file and keeps your originals untouched.'], ['3', 'Start free.', 'Try atePDF without an account. When your free allowance runs out, atePDF Pro keeps you working, and your files always stay yours.']].map(([n, t, b]) => `<div class="sheet" style="width:360px"><div class="sh-body" style="gap:8px"><span class="m">Pane ${n} of 3</span>${n === '1' ? `<img src="../brand/mark-a-folio-eight.svg" width="36" height="36" alt="">` : ''}<h3 style="font:var(--type-title1)">${t}</h3><p class="m" style="margin:0">${b}</p></div><div class="sh-foot"><span class="btn primary">${n === '3' ? 'Get Started' : 'Continue'}</span></div></div>`).join('')}</div>`]);

S.push(['paywall', 'Pro, paywall and exhausted state (S14)', 'Prices, savings and allowance are runtime placeholders. Exhaustion blocks new work, never existing files.',
  win(shell({ tb: {}, empty: '<div class="empty"></div>', comp: '',
    overlay: `<div class="scrim"><div class="sheet" role="dialog" style="width:var(--size-sheet-md)"><div class="sh-body" style="padding:28px 32px 20px;gap:16px">
      <img src="../brand/mark-a-folio-eight.svg" width="32" height="32" alt=""><h3 style="font:var(--type-display);letter-spacing:var(--type-display-tracking)">atePDF Pro</h3>
      <p class="msg" style="color:var(--text-secondary);margin-top:-8px">Keep getting PDF work done by asking for it.</p>
      <div class="vstack" style="gap:6px">${['Keep working after your free allowance', 'The same local processing and privacy rules', 'Manage or cancel in {channel subscription settings}'].map(t => `<span class="hstack" style="gap:8px">${icc('check', '--status-success-fg', 14)}<span>${t}</span></span>`).join('')}</div>
      <div class="hstack" style="gap:10px;flex-wrap:nowrap">
        <div class="card" style="flex:1;box-shadow:none"><span style="font:var(--type-headline)">Monthly</span><div class="m">{monthly_price} / month</div></div>
        <div class="card" style="flex:1;box-shadow:none;background:var(--surface-selected);border-color:var(--accent-subtleBorder)"><div class="hstack" style="justify-content:space-between"><span style="font:var(--type-headline)">Annual</span>${icc('check', '--accent-text', 14)}</div><div class="m">{annual_price} / year · {computed saving}</div></div></div></div>
      <div class="sh-foot" style="justify-content:space-between"><span class="hstack m" style="gap:12px"><span>Restore Purchase</span><span>Terms</span><span>Privacy</span></span><span class="hstack" style="gap:8px"><span class="btn plain">Not Now</span><span class="btn primary lg">Continue</span></span></div></div></div>` }), { w: 820, h: 640 }) +
  win(shell({ tb: { ctx: { icon: 'file', t: 'Merged PDF', m: '24 pages' } },
    thread: `<div class="task">${resultCard({ title: 'Merged PDF', facts: '24 pages · 8.6 MB', undo: true, actionsBelow: true })}</div><div class="task">${req('Compress it')}${notice('lock', '--status-warning-fg', 'You\'ve used your free allowance. Upgrade to keep working. Your existing files are still available.')}</div>`,
    comp: `<div class="composer-wrap"><div class="composer" style="padding:12px 14px;display:flex;gap:10px;align-items:center">${icc('lock', '--status-warning-fg')}<span style="flex:1" class="m">Free allowance used. Your files, Save and Undo still work.</span><span class="btn plain">Restore Purchase</span><span class="btn primary">See atePDF Pro</span></div></div>` }), { w: 560, h: 640 })]);

S.push(['errors', 'Errors, refusals and recovery (S11)', 'Calm, specific, and always saying what is unchanged. Failures are messages with one next step, not red cards.',
  win(shell({ tb: { ctx: { icon: 'file', t: 'Merged PDF', m: '24 pages' } }, top: true,
    thread: `<div class="banner">${icc('cloudOff', '--text-secondary')}<span class="grow">atePDF AI isn't reachable right now. Your files and results are still here.</span><span class="btn plain">Status</span><span class="btn secondary">Retry</span></div>
      <div class="task">${req('Rotate the scanned pages')}${notice('ban', '--status-danger-fg', 'Signed-Appendix-scan.pdf has annotations I can\'t safely preserve in this operation yet. I haven\'t changed it.', '<span class="btn plain">What\'s supported?</span>')}</div>
      <div class="task">${req('Remove page 30')}${notice('cx', '--status-danger-fg', 'Merged PDF has 24 pages, so there\'s no page 30. Which pages should I remove?')}</div>
      <div class="task">${req('Compress it')}${notice('cx', '--status-danger-fg', 'The new copy didn\'t pass checks, so I didn\'t keep it. Merged PDF is unchanged.', '<span class="btn secondary">Try Again</span>')}</div>
      <div class="task">${notice('warn', '--status-warning-fg', 'Q3-Invoice-Northwind.pdf was moved or renamed. atePDF still has its copy, but can\'t link back to the original.', '<span class="btn plain">Locate…</span>')}</div>`,
    comp: composer({ ph: 'What next for Merged PDF?', chips: [] }) }), { w: 1024, h: 720 }) +
  `<div class="vstack" style="gap:16px">${win(`<div class="scrim" style="position:absolute"><div class="sheet" role="dialog" style="width:var(--size-sheet-sm)"><div class="sh-body">${icc('trash', '--status-danger-fg', 20)}<h3>Start over?</h3><p class="m" style="margin:0;font:var(--type-ui);color:var(--text-secondary)">This clears the conversation and atePDF's copies of its PDFs and results on this Mac. Files you added and PDFs you've saved elsewhere stay unchanged.</p></div><div class="sh-foot" style="justify-content:space-between"><span class="btn plain">Save Current Result…</span><span class="hstack" style="gap:8px"><span class="btn secondary focus">Cancel</span><span class="btn danger">Start Over</span></span></div></div></div>`, { w: 460, h: 300 })}
   ${win(`<div class="scrim" style="position:absolute"><div class="sheet" role="dialog" style="width:400px"><div class="sh-body">${icc('warn', '--status-warning-fg', 20)}<h3 style="font:var(--type-title2)">3 files with these names already exist in Downloads</h3></div><div class="sh-foot"><span class="btn plain">Cancel</span><span class="btn secondary">Replace</span><span class="btn primary">Keep Both</span></div></div></div>`, { w: 460, h: 240 })}</div>`,
  'Safety limits (BILL-07) use the refusal pattern and never show an upgrade prompt. Destructive sheets never make the destructive button the default.']);

S.push(['components', 'Components and states', 'Primitives in both appearances. Every state named in COMPONENT_INVENTORY is drawn here or in a screen above.',
  `<div class="gallery" style="width:100%">${['light', 'dark'].map(t => `<div class="gpanel" data-theme="${t}">
    <h4>Buttons: default · hover · pressed · focus · disabled · busy</h4>
    <div class="hstack"><span class="btn primary">Save…</span><span class="btn primary hover">Save…</span><span class="btn primary pressed">Save…</span><span class="btn primary focus">Save…</span><span class="btn disabled">Save…</span><span class="btn primary" style="width:92px"><span style="--accent-text:var(--text-onAccent);display:inline-flex">${glyph()}</span>Saving…</span></div>
    <div class="hstack"><span class="btn secondary">Keep Current Result</span><span class="btn secondary hover">Hover</span><span class="btn plain">Plain</span><span class="btn plain hover">Hover</span><span class="btn danger">Start Over</span><span class="btn dplain">Delete…</span></div>
    <h4>Tags, pills, keycaps</h4>
    <div class="hstack"><span class="tag cur">Current</span><span class="tag earl">Earlier</span><span class="tag ok">${ic('check', 12)}Verified</span><span class="tag warn">Quality changed</span><span class="tag bad">Unsupported</span><span class="tag lock">${ic('lock', 11)}Locked</span><span class="tag pro">Pro</span></div>
    <div class="hstack"><span class="pill local">${ic('shield', 14)}On this Mac</span><span class="pill out">${ic('out', 14)}Leaves this Mac</span><span class="pill muted">${ic('cloudOff', 14)}atePDF AI unavailable</span>${kbd('⌘K')}${kbd('⌘.')}${kbd('⌥⌘I')}</div>
    <h4>File rows: source · selected · importing · locked · unsupported · missing</h4>
    <div class="group">${fileRow({ ...SOURCES[0], cls: 'hover', hover: `<span style="color:var(--text-tertiary)">${ic('grip', 14)}</span><span class="ib sm">${ic('x', 14)}</span>` })}${fileRow({ ...SOURCES[1], cls: 'sel' })}${fileRow({ n: 3, name: 'Signed-Appendix-scan.pdf', facts: 'Checking…', kind: 'blank', tags: glyph() })}${fileRow({ n: 4, name: 'Contract-final.pdf', facts: 'Password needed', kind: 'locked', tags: '<span class="tag lock">' + ic('lock', 11) + 'Locked</span>' })}
      <div class="row tall">${icc('ban', '--status-danger-fg', 18)}<div class="grow"><span class="name">Form-W9.pdf</span><span class="m">Can't be added: has form fields I can't preserve yet</span></div></div>
      <div class="row tall">${icc('warn', '--status-warning-fg', 18)}<div class="grow"><span class="name">Q3-Invoice-Northwind.pdf</span><span class="m">Moved or unavailable · Locate…</span></div></div></div>
    <h4>Fields, segmented, toggle, meters</h4>
    <div class="hstack"><div class="field" style="width:160px">Placeholder</div><div class="field focus" style="width:160px"><span class="dots">••••••</span><span class="caret"></span></div><span class="seg"><span class="on">Monthly</span><span>Annual</span></span><span class="toggle on"></span><span class="toggle"></span></div>
    <div class="vstack" style="gap:4px"><span class="m" style="color:var(--status-danger-fg);display:flex;gap:6px;align-items:center">${ic('cx', 12)}That password didn't work. Try again.</span></div>
    <div class="vstack" style="gap:6px"><div class="meter"><b style="width:40%;background:var(--accent-fill)"></b></div><div class="meter"><b style="width:85%;background:var(--status-warning-fg)"></b></div><div class="meter"><b style="width:100%;background:var(--status-danger-fg)"></b></div></div>
    <h4>Evidence proposal (UNDERSTAND-03)</h4>
    <div class="card"><div class="hstack" style="gap:10px;align-items:flex-start;flex-wrap:nowrap">${icc('scan', '--text-secondary')}<div class="vstack" style="gap:6px;flex:1"><span style="font:var(--type-headline)">Remove these 2 pages?</span><span class="m">They look blank. Page 5 has faint marks, so check it first.</span>
      <div class="hstack" style="gap:12px">${[['4', 'Looks blank', true], ['5', 'Faint marks', false]].map(([p, r, on]) => `<span class="vstack" style="gap:4px;align-items:center;padding:4px;border-radius:var(--radius-md);${on ? 'background:var(--surface-selected);box-shadow:inset 0 0 0 1px var(--accent-subtleBorder)' : ''}">${thumb(54, 72, 'blank')}<span class="m">p. ${p} · ${r}</span></span>`).join('')}</div>
      <div class="hstack"><span class="btn primary">Remove 1 Page</span><span class="btn plain">Cancel</span></div></div></div></div>
    <h4>Activity glyph · stages</h4>
    ${activity({ label: 'Checking 3 PDFs', detail: '2 of 3 checked', marker: 'local' })}
    ${activity({ label: 'Still waiting for atePDF AI', detail: 'You can stop; nothing has changed.', marker: 'ai' })}
    <h4>Composer states</h4>
    ${composer({ typed: 'Merge these and put the invoice first', send: 'on', focus: true }).replace('composer-wrap', 'composer-wrap" style="padding:0')}
    ${composer({ typed: 'password is hunter2', warn: 'That looks like a password. Use the secure field so it stays out of the chat.', send: 'off' }).replace('composer-wrap', 'composer-wrap" style="padding:0')}
  </div>`).join('')}</div>`]);

/* ——— Render ——— */
const only = new URLSearchParams(location.search).get('only');
document.getElementById('doc').innerHTML = S.filter(s => !only || s[0] === only).map(s => section(...s)).join('');
if (only) document.querySelector('.page-head').style.display = 'none';
document.getElementById('nav').innerHTML = S.map(([id, t]) => `<a href="#${id}">${t.replace(/<[^>]+>/g, '').split(' (')[0].split(' · ')[0]}</a>`).join('');
const setTheme = t => { document.documentElement.dataset.theme = t; document.querySelectorAll('[data-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.set === t))); try { localStorage.setItem('atepdf-mock-theme', t); } catch (e) {} };
document.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.set)));
const q = new URLSearchParams(location.search).get('theme');
let saved = null; try { saved = localStorage.getItem('atepdf-mock-theme'); } catch (e) {}
setTheme(q || saved || 'light');
if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
